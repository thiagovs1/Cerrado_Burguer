<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <title>Recuperar Senha - Cerrado Burguer</title>
        <link rel="stylesheet" href="../css/login.css" />
    </head>
    <body>
        <header class="topo">
            <img src="../imagens/logo.png" class="logo" />
            <nav>
                <a href="../html/tela-inicial.html">Inicio</a>
                <a href="#">Promoções do dia</a>
                <a href="#">Cardápio</a>
                <a href="#">Contato</a>
                <a href="#">Avaliações</a>
            </nav>
            <div class="icones">
                <img src="../imagens/Perfil.png" class="icone-img" />
                <img src="../imagens/carrinho.png" class="icone-img" />
            </div>
        </header>

        <div class="area-login">
            <div class="login-container">
                <h1>RECUPERAR</h1>
                <p class="subtitulo">Altere sua senha</p>

                <form action="recuperar.php" method="POST">
                    <label>E-mail:</label>
                    <input type="email" name="email" placeholder="Digite seu e-mail" required />

                    <label>Nova senha:</label>
                    <input type="password" name="senha1" placeholder="Nova senha" required />

                    <label>Confirmar senha:</label>
                    <input type="password" name="senha2" placeholder="Repita a senha" required />

                    <button type="submit">Salvar senha</button>
                </form>

                <p id="mensagem"></p>

                <div class="opcoes">
                    <a href="login.html">Voltar</a>
                </div>
            </div>
        </div>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const erro = urlParams.get('erro');
            const mensagemElement = document.getElementById('mensagem');

            if (erro) {
                mensagemElement.innerText = erro;
                mensagemElement.style.color = 'red';
            }
        </script>
    </body>
</html>

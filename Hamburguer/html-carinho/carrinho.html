<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Cerrado Burguer</title>

    <link rel="stylesheet" href="../css-carrinho/carrinho.css">
</head>

<body>

<header class="topo">

    <a href="../html/tela-inicial.html">
        <img src="../imagens/logo.png" class="logo">
    </a>

    <nav>
        <a href="../html/tela-inicial.html">Inicio</a>
        <a href="../html/tela-inicial.html">Promoções do dia</a>
        <a href="../html/cardapio.html">Cardápio</a>
        <a href="../html/tela-inicial.html">Contato</a>
        <a href="../html/avaliacoes.html">Avaliações</a>
    </nav>

    <div class="icones">

        <a href="../crud/perfil.php">
            <img src="../imagens/perfil.png" class="icone-img">
        </a>

        <a href="carrinho.html">
            <img src="../imagens/carrinho.png" class="icone-img">
        </a>

    </div>

</header>


<section class="pedidos">

    <div class="produtos" id="lista-carrinho">

    </div>

    <div class="resumo">

        <div class="box">

            <h2>Resumo do Pedido</h2>

            <div class="linha">
                <span>Subtotal:</span>
                <span id="subtotal">R$ 0,00</span>
            </div>

            <div class="linha">
                <span>Entrega:</span>
                <span id="entrega">R$ 0,00</span>
            </div>

            <div class="linha total">
                <span>Total:</span>
                <span id="total">R$ 0,00</span>
            </div>

        </div>


        <div class="box observacao-box">

            <h2>Observação:</h2>

            <div class="obs">

                <textarea
                    id="observacao"
                    rows="4"
                    maxlength="100"
                    placeholder="Digite alguma observação para o pedido..."
                ></textarea>

            </div>

        </div>


        <div class="botoes">

            <button
                id="btn-cancelar"
                class="cancelar"
                type="button">
                Cancelar
            </button>

            <button
                class="confirmar"
                id="btn-confirmar">
                Confirmar
            </button>

        </div>

    </div>

</section>


<script src="../js/carrinho.js"></script>

</body>
</html>

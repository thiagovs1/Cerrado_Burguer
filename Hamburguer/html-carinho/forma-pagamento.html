<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Forma de Pagamento</title>

<link rel="stylesheet" href="../css-carrinho/forma-pagamento.css">


</head>

<body>

<header class="topo">


<a href="../html/tela-inicial.html">
    <img src="../imagens/logo.png" class="logo">
</a>

<nav>
    <a href="../html/tela-inicial.html">Inicio</a>
    <a href="../html/tela-inicial.html">Promoções do dia</a>
    <a href="../html/cardapio.html">Cardápio</a>
    <a href="../html/contato.html">Contato</a>
    <a href="../html/avaliacoes.html">Avaliações</a>
</nav>

<div class="icones">

    <img src="../imagens/perfil.png" class="icone-img">
    <img src="../imagens/carrinho.png" class="icone-img">

</div>


</header>

<section class="pagamento-section">


<form>

    <div class="pagamento-esquerda">

        <h1>Selecione a Forma de pagamento:</h1>


        <div class="pagamento-box">

            <label class="forma-pagamento">

                <div class="lado-esquerdo">

                    <input
                        type="radio"
                        name="pagamento"
                        value="Dinheiro"
                    >

                    <span>Dinheiro</span>

                </div>

                <img src="../imagens/dinheiro.png">

            </label>


            <label class="forma-pagamento">

                <div class="lado-esquerdo">

                    <input
                        type="radio"
                        name="pagamento"
                        value="Pix"
                    >

                    <span>Pix</span>

                </div>

                <img src="../imagens/pix.png">

            </label>


            <label class="forma-pagamento">

                <div class="lado-esquerdo">

                    <input
                        type="radio"
                        name="pagamento"
                        value="Cartão"
                    >

                    <span>Cartão</span>

                </div>

                <img src="../imagens/cart.png">

            </label>

        </div>

        <div class="troco-box">

            <h3>Precisa de Troco?</h3>

            <div class="troco-input">

                <label>

                    <input
                        type="radio"
                        name="troco"
                        value="sim"
                        id="troco-sim"
                    >

                    Sim

                </label>


                <input
                    type="text"
                    id="valor-troco"
                    placeholder="R$ 0,00"
                    disabled
                >

            </div>

        </div>

    </div>

    <div class="pagamento-direita">

        <div class="resumo-pagamento">

            <h2>Resumo do Pedido</h2>


            <div class="endereco-box">

                <img src="../imagens/loja.png">

                <div>

                    <p id="endereco-resumo">
                        Endereço de entrega
                    </p>

                    <p id="cidade-resumo">
                        Cidade
                    </p>

                </div>

            </div>


            <hr>


            <div class="linha-pagamento">

                <span>Subtotal:</span>

                <span id="subtotal-pagamento">
                    R$ 0,00
                </span>

            </div>


            <div class="linha-pagamento">

                <span>Entrega:</span>

                <span id="entrega-pagamento">
                    R$ 0,00
                </span>

            </div>


            <hr>


            <div class="total-pagamento">

                <span>Total:</span>

                <span id="total-pagamento">
                    R$ 0,00
                </span>

            </div>

        </div>
        
        <div class="botoes-pagamento">

            <button
                type="button"
                class="btn-cancelar"
                onclick="window.location.href='endereco.html'"
            >
                Cancelar
            </button>


            <button
                type="button"
                class="btn-confirmar"
                id="btn-confirmar-pagamento"
            >
                Confirmar
            </button>

        </div>

    </div>

</form>


</section>

<script src="../js/forma-pagamento.js"></script>

</body>

</html>
